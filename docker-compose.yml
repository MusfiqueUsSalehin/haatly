services:
  mongo:
    image: mongo:8
    container_name: haatly-mongo
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - haatly-mongo-data:/data/db
    restart: unless-stopped

  server:
    profiles: [app]
    build: ./server
    depends_on: [mongo]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/haatly
      CLIENT_ORIGINS: ${CLIENT_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file next to docker-compose.yml}
      TRUST_PROXY: 1
      ENABLE_SCHEDULER: 'true'
      PAYMENT_PROVIDER: none
      AI_PROVIDER: ${AI_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-haiku-5-5}
      AI_MAX_CALLS_PER_DAY: ${AI_MAX_CALLS_PER_DAY:-100}
    volumes:
      - haatly-uploads:/app/uploads

  client:
    profiles: [app]
    build: ./client
    depends_on: [server]
    ports:
      - '8080:80'
    restart: unless-stopped

volumes:
  haatly-mongo-data:
  haatly-uploads:
