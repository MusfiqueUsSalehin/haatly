services:
  mongo:
    image: mongo:8
    container_name: haatly-mongo
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - haatly-mongo-data:/data/db
    restart: unless-stopped

volumes:
  haatly-mongo-data:

        AI_PROVIDER: ${AI_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-haiku-5-5}
      AI_MAX_CALLS_PER_DAY: ${AI_MAX_CALLS_PER_DAY:-100}
